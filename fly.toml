# Fly.io always-on machine for 24/7 trading (UI + /api + scheduler).
# Morgen:
#   1. install flyctl, fly auth login
#   2. fly apps create kasvolume   # or use an existing app name
#   3. fly secrets set DATABASE_URL=... SESSION_SECRET=...
#   4. fly deploy
#   5. open https://<app>.fly.dev/
#
# Keep min_machines_running = 1 so the trade scheduler never sleeps.

app = "kasvolume"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  STATIC_DIR = "/app/public"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
